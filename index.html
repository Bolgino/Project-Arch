<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Azimut.Arch</title>
    <meta name="description" content="Armadio e cambusa del gruppo scout">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#163f30">
    <link rel="preload" href="fonts/BarlowCondensed-Bold.woff" as="font" type="font/woff" crossorigin>
    <link rel="stylesheet" href="common.css">
    <style>
        body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
        .portale { position: relative; isolation: isolate; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 40px 16px calc(28px + var(--safe-b)); overflow: hidden; }
        .portale::before {
            content: ""; position: absolute; inset: -10% -40% 0 -10%; z-index: -1;
            background: var(--curve);
            -webkit-mask: url(img/curve.svg) right top / cover no-repeat; mask: url(img/curve.svg) right top / cover no-repeat;
            opacity: .22;
        }
        .marchio { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
        .marchio img { width: 84px; height: 84px; border-radius: 50%; background: var(--superficie); box-shadow: var(--ombra); }
        .marchio h1 { font-size: 46px; letter-spacing: .02em; color: var(--bosco-scuro); }
        .marchio p { color: var(--grigio); max-width: 30ch; }

        /* Palo con le frecce segnavia */
        .palo { position: relative; width: min(340px, 100%); margin: 38px auto 0; padding: 6px 0 64px; }
        .palo::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 16px; margin-left: -8px; background: #7b5532; border-radius: 4px 4px 0 0; box-shadow: inset -4px 0 0 rgba(0,0,0,.14); }
        .palo::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 120px; height: 10px; margin-left: -60px; border-radius: 50%; background: rgba(60, 40, 20, .16); }
        .freccia {
            position: relative; display: block; text-decoration: none; color: #fff;
            width: 92%; padding: 16px 52px 16px 20px; margin-bottom: 16px;
            background: var(--bosco);
            clip-path: polygon(0 0, calc(100% - 34px) 0, 100% 50%, calc(100% - 34px) 100%, 0 100%);
            filter: drop-shadow(0 3px 0 rgba(0,0,0,.18));
            transition: transform .15s ease;
        }
        .freccia.sinistra { margin-left: auto; padding: 16px 20px 16px 52px; text-align: right; background: var(--fuoco);
            clip-path: polygon(34px 0, 100% 0, 100% 100%, 34px 100%, 0 50%); }
        .freccia:hover { transform: translateX(4px); }
        .freccia.sinistra:hover { transform: translateX(-4px); }
        .freccia:active { transform: scale(.98); }
        .freccia:focus-visible { outline: none; filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 4px var(--inchiostro)); }
        .freccia b { display: block; font-family: var(--display); font-size: 38px; line-height: 1; letter-spacing: .02em; }
        .freccia span { display: block; font-size: 14.5px; opacity: .9; margin-top: 4px; }
        .piede { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: auto; padding-top: 18px; }
        .piede .motto { font-family: var(--display); font-weight: 600; font-size: 18px; color: var(--grigio); }
    </style>
</head>
<body>
    <main class="portale" id="portale">
        <div class="marchio">
            <img src="icon-192.png" alt="">
            <h1>Azimut.Arch</h1>
            <p>Il materiale del gruppo, sempre sotto controllo.</p>
        </div>

        <nav class="palo" aria-label="Scegli dove andare">
            <a class="freccia" href="armadio.html">
                <b>Armadio</b>
                <span>Distintivi, specialità e kit promessa</span>
            </a>
            <a class="freccia sinistra" href="cambusa.html">
                <b>Cambusa</b>
                <span>Dispensa, ricette e menu dei campi</span>
            </a>
        </nav>

        <div class="piede">
            <button class="btn btn-tenue" data-installa hidden>Installa l'app sul telefono</button>
            <button class="btn btn-testo" id="btn-admin" type="button">Accesso admin</button>
            <p class="motto">Estote parati</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="common.js"></script>
    <script>
        (async function () {
            ui.montaFogliComuni();
            await auth.init();
            const btn = $('#btn-admin');
            if (auth.user) {
                btn.textContent = 'Esci dall\'area admin';
                btn.onclick = () => auth.logout();
            } else {
                btn.onclick = () => auth.apriLogin();
            }
            if (inManutenzione('portale')) {
                mostraManutenzione($('#portale'), 'Stiamo sistemando il sito, torna più tardi.');
            }
        })();
    </script>
</body>
</html>
